name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [build/android-apk]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm ci
      - name: Use separate Android identity for test install
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('app.json','utf8')); p.expo.name='مدعوم تجربة'; p.expo.android.package='com.mad3oom.app.testbuild'; fs.writeFileSync('app.json',JSON.stringify(p,null,2)+'\\n');"
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Assemble installable release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mad3oom-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
